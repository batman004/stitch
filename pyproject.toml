[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# "stitch" is taken on PyPI, so the distribution is stitch-durable. The import name is still `stitch`.
name = "stitch-durable"
version = "0.1.0"
description = "Resumable async Python pipelines from the standard library alone: checkpoints, retries, audit trail, provider fallbacks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
keywords = ["durable-execution", "checkpoint", "asyncio", "workflow", "retry", "circuit-breaker"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]

[tool.setuptools]
packages = ["stitch"]
[tool.setuptools.package-data]
stitch = ["py.typed"]
